name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Embarquer les composants QR (hors ligne)
        run: |
          mkdir -p "$RUNNER_TEMP/libs" && cd "$RUNNER_TEMP/libs"
          npm init -y >/dev/null
          npm install qrcode@1.4.4 jsqr@1.4.0 --no-audit --no-fund
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets/libs"
          cp node_modules/qrcode/build/qrcode.min.js "$GITHUB_WORKSPACE/app/src/main/assets/libs/qrcode.min.js"
          cp node_modules/jsqr/dist/jsQR.js "$GITHUB_WORKSPACE/app/src/main/assets/libs/jsQR.js"
          ls -la "$GITHUB_WORKSPACE/app/src/main/assets/libs"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Preparer la cle privee
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cle.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/cle.keystore" >> "$GITHUB_ENV"

      - name: Construire l'APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk JM_LAB_PRO.apk

      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: JM LAB PRO (version ${{ github.run_number }})
          files: JM_LAB_PRO.apk
