name: Regard Pur (PC Windows)

on:
  push:
    branches: [main, master, 'claude/**']
    paths: ['projets/RegardPur/**', '.github/workflows/regardpur.yml', 'app/src/main/assets/index.html', 'app/src/main/assets/jmwork.js']
  workflow_dispatch:

permissions:
  contents: write

# une seule fabrication a la fois : la derniere version envoyee est toujours celle publiee
concurrency:
  group: regardpur-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: projets/RegardPur/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les briques
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm ci --no-audit --no-fund

      - name: Embarquer les modeles d'IA locale (NAFNet, Real-ESRGAN)
        shell: bash
        run: |
          mkdir -p modeles
          for f in deblurring_nafnet.onnx realesr-general-x4v3.onnx realesr-general-wdn-x4v3.onnx; do
            curl -fsSL -o modeles/$f https://github.com/${{ github.repository }}/releases/download/regardpur-modeles/$f
          done
          for f in scunet_color_real_psnr.onnx gfpgan_v14.onnx; do
            curl -fsSL -o modeles/$f https://github.com/${{ github.repository }}/releases/download/regardpur-modeles/$f || echo "pas encore : $f"
          done
          ls -la modeles

      - name: Embarquer le module visages (hors ligne)
        run: node tools/vendor.js

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Embarquer l'oeil artistique (modele NIMA, hors ligne)
        run: |
          python -m pip install --quiet h5py numpy
          python tools/nima_export.py

      - name: Fabriquer RegardPur.exe (portable) et l'installateur
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win portable nsis --x64 --publish never

      - name: Version ZIP (plus facile a telecharger avec Edge)
        shell: pwsh
        run: Compress-Archive -Path dist/RegardPur.exe -DestinationPath dist/RegardPur.zip -CompressionLevel Optimal

      - name: Lister les fichiers
        shell: bash
        run: ls -la dist

      - name: Retirer l'ancien .exe seul (on garde le ZIP et l'installateur)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ (github.ref_name == 'main' || github.ref_name == 'master') && 'regardpur' || 'regardpur-test' }}
          gh release delete-asset "$TAG" RegardPur.exe -y -R "${{ github.repository }}" || true

      - name: Publier
        # depot des fichiers seulement (sans modifier la publication elle-meme : evite le refus « Resource not accessible »)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ (github.ref_name == 'main' || github.ref_name == 'master') && 'regardpur' || 'regardpur-test' }}
          gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1 || gh release create "$TAG" -R "${{ github.repository }}" --prerelease --title "Regard Pur (PC)" --notes "Regard Pur pour Windows. RegardPur.zip : a decompresser, puis double-clic sur RegardPur.exe. RegardPur_Installation.exe : installe avec un raccourci." --target "${{ github.sha }}"
          gh release upload "$TAG" dist/RegardPur.zip dist/RegardPur_Installation.exe --clobber -R "${{ github.repository }}"
